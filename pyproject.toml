[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honba-examples"
version = "0.1.0"
description = "Honba learning path examples"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Honba Labs" }]
requires-python = ">=3.10"
dependencies = ["honba"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["honba_examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"
