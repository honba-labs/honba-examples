# Phase 5.2: multibagger momentum + QGLP fundamental overlay chain.
# Stage 2 breakout candidates, then ROCE >= 20% and debt-to-equity <= 0.5.
# Run:
#   python examples/screening/06_run_chain.py --chain screening/chains/fundamentals.toml --asof 2024-01-01 --format symbols

[[steps]]
uses = "screen.multibagger"
with = { asof = "2024-01-01", top = 50 }

[[steps]]
uses = "filter.fundamental_quality"
with = { min_roce = 20.0, max_debt_to_equity = 0.5 }
report = ["market_cap", "roce_pct", "debt_to_equity", "pe_ratio"]
